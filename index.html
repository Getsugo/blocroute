<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2a1a">
<title>BlocRoute</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --txt: #ffffff; --shadow: #3f3f3f; --yellow: #ffff55; --green: #55ff55;
    --panel: rgba(0, 0, 0, .62);
  }
  html, body { margin: 0; height: 100%; background: #78a7ff; overflow: hidden;
    font-family: 'VT323', monospace; color: var(--txt); text-shadow: 2px 2px 0 var(--shadow);
    -webkit-tap-highlight-color: transparent; user-select: none; }
  #map { position: absolute; inset: 0; }
  /* Rendu en gros pixels : la carte est dessinée en basse définition puis agrandie sans lissage */
  #map canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  body.night #map canvas { filter: brightness(.62) saturate(.85) hue-rotate(-8deg); }
  .hidden { display: none !important; }

  /* Panneaux façon interface de jeu */
  .box {
    position: absolute; left: 12px; right: 12px; max-width: 460px; box-sizing: border-box;
    background: var(--panel); padding: 10px 12px;
    border: 3px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -2px 0 rgba(0,0,0,.5);
  }
  #top, #instr { top: calc(env(safe-area-inset-top) + 12px); }
  #bottom { bottom: calc(env(safe-area-inset-bottom) + 12px); }

  .search input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 26px; color: #fff; text-shadow: 2px 2px 0 var(--shadow);
    background: #000; border: 2px solid #a0a0a0; padding: 6px 10px; outline: none; border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { border-color: #fff; }
  .search input::placeholder { color: #8b8b8b; text-shadow: none; }
  #results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow-y: auto; }
  #results:empty { display: none; }
  #results li { padding: 8px 6px; border-top: 2px solid rgba(255,255,255,.12); cursor: pointer; font-size: 23px; line-height: 1.1; }
  #results li:active { background: rgba(255,255,255,.15); color: var(--yellow); }
  #results .sub { color: #aaaaaa; font-size: 19px; }
  #results .head { color: var(--yellow); font-size: 19px; cursor: default; border-top: none; }

  #instr { display: flex; align-items: center; gap: 12px; }
  #iArrow { width: 56px; height: 56px; flex: none; }
  #iArrow svg { width: 100%; height: 100%; shape-rendering: crispEdges; display: block; filter: drop-shadow(2px 2px 0 #3f3f3f); }
  #iDist { font-size: 38px; color: var(--yellow); line-height: 1; }
  #iTxt { font-size: 23px; line-height: 1.1; }

  #bInfo { font-size: 25px; line-height: 1.15; }
  #bInfo .sub { color: #aaaaaa; font-size: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  /* Boutons en pierre */
  .btn {
    display: inline-block; font-family: inherit; font-size: 23px; color: #e0e0e0; text-decoration: none; text-align: center;
    text-shadow: 2px 2px 0 var(--shadow); cursor: pointer; padding: 6px 12px; border-radius: 0;
    background: #6f6f6f var(--stone-url, none); background-size: 64px 64px; image-rendering: pixelated;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -3px 0 rgba(0,0,0,.45);
  }
  .btn:active { color: var(--yellow); box-shadow: inset 2px 2px 0 rgba(0,0,0,.45), inset -2px -2px 0 rgba(255,255,255,.25); }
  .btn.green { background-color: #3c8527; background-blend-mode: multiply; color: #fff; }
  .btn.red { background-color: #9a2c2c; background-blend-mode: multiply; color: #fff; }
  .btn.blue { background-color: #2c6aa0; background-blend-mode: multiply; color: #fff; }
  .row .btn { flex: 1 1 auto; }

  .side { position: absolute; right: 12px; top: 45%; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .side .btn { font-size: 20px; padding: 4px 10px; }

  #toast {
    position: absolute; left: 50%; top: 36%; transform: translateX(-50%); max-width: 80%;
    background: var(--panel); border: 3px solid #000; padding: 8px 14px; font-size: 23px; text-align: center;
    pointer-events: none;
  }

  .pix svg { width: 100%; height: 100%; shape-rendering: crispEdges; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); display: block; }
  .player { width: 44px; height: 48px; }
  .flag { width: 32px; height: 40px; }
  .maplibregl-ctrl-attrib { font-family: system-ui, sans-serif; font-size: 10px; text-shadow: none; color: #000; }

  /* Écran de chargement */
  #loader {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #3b2a1a var(--dirt-url, none); background-size: 96px 96px; image-rendering: pixelated;
    transition: opacity .4s;
  }
  #loader::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  #loader > * { position: relative; }
  #logo { font-size: 72px; line-height: 1; color: #d8d8d8; text-shadow: 4px 4px 0 #2a2a2a, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; letter-spacing: 2px; }
  #splash { color: var(--yellow); font-size: 26px; transform: rotate(-12deg); margin: -6px 0 0 180px;
    animation: pulse .5s ease-in-out infinite alternate; text-shadow: 2px 2px 0 #3f3f00; white-space: nowrap; }
  @keyframes pulse { from { transform: rotate(-12deg) scale(1); } to { transform: rotate(-12deg) scale(1.08); } }
  #loadTxt { margin-top: 48px; font-size: 26px; }
  #bar { width: 240px; height: 10px; margin-top: 10px; background: #808080; border: 2px solid #000; }
  #barFill { height: 100%; width: 0; background: var(--green); transition: width .3s; }
  #loader.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="box">
  <div class="search">
    <input id="q" type="search" placeholder="Où va-t-on ?" autocomplete="off" enterkeyhint="search">
  </div>
  <ul id="results"></ul>
</div>

<div id="instr" class="box hidden">
  <div id="iArrow"></div>
  <div>
    <div id="iDist"></div>
    <div id="iTxt"></div>
  </div>
</div>

<div id="bottom" class="box hidden">
  <div id="bInfo"></div>
  <div class="row" id="bBtns"></div>
</div>

<div class="side">
  <button class="btn" id="voiceBtn"></button>
  <button class="btn hidden" id="recenter">Recentrer</button>
</div>

<div id="toast" class="hidden"></div>

<div id="loader">
  <div id="logo">BlocRoute</div>
  <div id="splash"></div>
  <div id="loadTxt">Génération du monde…</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
   1. TEXTURES PIXEL MAISON (16x16, agrandies x4)
   ===================================================================== */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

function texCanvas(seed, pixelFn) {
  const N = 16, S = 4;
  const c = document.createElement('canvas');
  c.width = c.height = N * S;
  const ctx = c.getContext('2d');
  const r = rng(seed);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = pixelFn(x, y, r);
    ctx.fillRect(x * S, y * S, S, S);
  }
  return c;
}
const asData = c => c.getContext('2d').getImageData(0, 0, c.width, c.height);

const GRASS = ['#5d9c34', '#66a83a', '#6fb240', '#579330', '#7cbd47'];
const STONE = ['#7f7f7f', '#8a8a8a', '#747474', '#969696', '#6b6b6b'];

// Pavés : blocs 4x4 aux joints décalés
function cobble(seed) {
  const r0 = rng(seed + 100), offs = Array.from({ length: 16 }, () => Math.floor(r0() * 3));
  return (x, y, r) => {
    const row = Math.floor(y / 4), col = Math.floor(x / 4);
    if ((x + offs[row]) % 4 === 0 || (y + offs[col + 4]) % 4 === 0) return pick(r, ['#4f4f4f', '#565656', '#4a4a4a']);
    return pick(r, ['#8c8c8c', '#9a9a9a', '#7e7e7e', '#a5a5a5']);
  };
}
function bricks(colors, mortar, w) {
  return (x, y, r) => {
    const row = Math.floor(y / 4);
    if (y % 4 === 3) return mortar;
    if ((x + (row % 2 ? w / 2 : 0)) % w === 0) return mortar;
    return pick(r, colors);
  };
}

const CANVAS = {
  grass:   texCanvas(1, (x, y, r) => pick(r, GRASS)),
  flowers: texCanvas(11, (x, y, r) => {
    const f = { '3,4': '#e33', '11,2': '#ff5', '7,10': '#e33', '13,12': '#5bf', '2,13': '#ff5' }[x + ',' + y];
    return f || pick(r, GRASS);
  }),
  leaves:  texCanvas(2, (x, y, r) => r() < .1 ? '#173d0f' : pick(r, ['#2f6b1e', '#3a7d25', '#285c19', '#43892b'])),
  planks:  texCanvas(3, (x, y, r) => {
    const row = y % 4, band = Math.floor(y / 4);
    if (row === 3) return '#7a5a32';
    if (x === (band % 2 ? 4 : 12)) return '#8d6a3c';
    return pick(r, ['#c8a165', '#bd9659', '#b38c52', '#c29b5f']);
  }),
  bricks:  texCanvas(12, bricks(['#9b4a35', '#a8553f', '#8e4230', '#b05e46'], '#b8aea4', 8)),
  stonebr: texCanvas(13, bricks(['#7d7d7d', '#878787', '#727272', '#8f8f8f'], '#4e4e4e', 16)),
  cobble:  texCanvas(14, cobble(14)),
  stone:   texCanvas(4, (x, y, r) => pick(r, STONE)),
  gravel:  texCanvas(5, (x, y, r) => pick(r, ['#a89f8f', '#b5ac9b', '#968e80', '#c0b8a8', '#8a8273'])),
  path:    texCanvas(15, (x, y, r) => pick(r, ['#8b6a3e', '#96744a', '#7d5e36', '#a07d50', '#8f7044'])),
  farm:    texCanvas(16, (x, y, r) => (y % 4 < 2) ? pick(r, ['#4a3420', '#523a24', '#43301d']) : pick(r, ['#6e5032', '#77583a', '#664a2e'])),
  sand:    texCanvas(7, (x, y, r) => pick(r, ['#dbcf8e', '#e3d79c', '#d2c584', '#e8dda8'])),
  snow:    texCanvas(17, (x, y, r) => pick(r, ['#f4f8ff', '#e8eef8', '#ffffff', '#dfe7f2'])),
  dirt:    texCanvas(18, (x, y, r) => pick(r, ['#79553a', '#866043', '#6c4b33', '#5e412c', '#916a4b'])),
};
const TEX = {};
for (const [k, c] of Object.entries(CANVAS)) if (k !== 'dirt') TEX[k] = asData(c);

// Eau animée : 8 images qui défilent
const WATER_FRAMES = Array.from({ length: 8 }, (_, f) => asData(texCanvas(6, (x, y, r) => {
  const v = r();
  const wave = (x + y * 2 + f * 2) % 8;
  if (wave === 0 && v > .35) return '#6f8ff0';
  if (wave === 1 && v > .6) return '#5a7ce8';
  return ['#3f63d8', '#4169e1', '#3858cc', '#466fe6'][Math.floor(v * 4)];
})));
TEX.water = WATER_FRAMES[0];

// Textures réutilisées dans l'interface
document.documentElement.style.setProperty('--dirt-url', `url(${CANVAS.dirt.toDataURL()})`);
document.documentElement.style.setProperty('--stone-url', `url(${CANVAS.stone.toDataURL()})`);

/* =====================================================================
   2. STYLE DE CARTE
   ===================================================================== */
const ROAD_BIG = ['motorway', 'trunk'];
const ROAD_MID = ['primary', 'secondary', 'tertiary'];
const ROAD_SMALL = ['minor', 'service'];
const ROAD_ALL = [...ROAD_BIG, ...ROAD_MID, ...ROAD_SMALL];
const PATHS = ['path', 'track'];
const NAME = ['coalesce', ['get', 'name:fr'], ['get', 'name']];
const HEIGHT = ['coalesce', ['get', 'render_height'], 8];

function roadWidth(add) {
  const w = (big, mid, small) => ['+', ['match', ['get', 'class'], ROAD_BIG, big, ROAD_MID, mid, small], add];
  return ['interpolate', ['exponential', 1.5], ['zoom'], 12, w(3, 2, .5), 16, w(16, 12, 6), 19, w(56, 44, 24)];
}
const roadLayer = (id, classes, pattern) => ({
  id, type: 'line', source: 'omt', 'source-layer': 'transportation',
  filter: ['match', ['get', 'class'], classes, true, false],
  layout: { 'line-join': 'miter' },
  paint: { 'line-pattern': pattern, 'line-width': roadWidth(0) }
});
const buildingLayer = (id, filter, pattern) => ({
  id, type: 'fill-extrusion', source: 'omt', 'source-layer': 'building', minzoom: 14, filter,
  paint: {
    'fill-extrusion-pattern': pattern,
    // hauteurs arrondies par blocs de 4 m
    'fill-extrusion-height': ['*', 4, ['ceil', ['/', HEIGHT, 4]]],
    'fill-extrusion-base': ['*', 4, ['floor', ['/', ['coalesce', ['get', 'render_min_height'], 0], 4]]],
    'fill-extrusion-opacity': 1
  }
});
const fillLayer = (id, layer, classes, pattern) => ({
  id, type: 'fill', source: 'omt', 'source-layer': layer,
  filter: ['match', ['get', 'class'], classes, true, false],
  paint: { 'fill-pattern': pattern }
});

const SKY_DAY = { 'sky-color': '#78a7ff', 'horizon-color': '#c2d8ff', 'fog-color': '#c2d8ff',
  'sky-horizon-blend': 0.7, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.85, 'atmosphere-blend': 0 };
const SKY_NIGHT = { 'sky-color': '#0b0f2a', 'horizon-color': '#1c2350', 'fog-color': '#141a3c',
  'sky-horizon-blend': 0.7, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.85, 'atmosphere-blend': 0 };

const style = {
  version: 8,
  glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sky: SKY_DAY,
  sources: {
    omt: {
      type: 'vector',
      url: 'https://tiles.openfreemap.org/planet',
      attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Itinéraires <a href="https://project-osrm.org">OSRM</a> · Recherche <a href="https://photon.komoot.io">Photon</a>'
    },
    trajet: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    balise: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } }
  },
  layers: [
    { id: 'herbe', type: 'background', paint: { 'background-pattern': 'grass' } },
    fillLayer('champs', 'landcover', ['farmland'], 'farm'),
    fillLayer('prairies', 'landcover', ['grass'], 'flowers'),
    { id: 'parcs', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-pattern': 'flowers' } },
    fillLayer('zones-grises', 'landuse', ['industrial', 'commercial', 'railway', 'retail'], 'gravel'),
    fillLayer('foret', 'landcover', ['wood', 'forest'], 'leaves'),
    fillLayer('rochers', 'landcover', ['rock'], 'stone'),
    fillLayer('neige', 'landcover', ['ice', 'glacier'], 'snow'),
    fillLayer('sable', 'landcover', ['sand'], 'sand'),
    { id: 'eau', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-pattern': 'water' } },
    { id: 'rivieres', type: 'line', source: 'omt', 'source-layer': 'waterway',
      paint: { 'line-pattern': 'water', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 2, 18, 12] } },
    { id: 'chemins', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 14,
      filter: ['match', ['get', 'class'], PATHS, true, false],
      paint: { 'line-pattern': 'path', 'line-width': ['interpolate', ['exponential', 1.5], ['zoom'], 14, 2, 19, 14] } },
    { id: 'routes-bord', type: 'line', source: 'omt', 'source-layer': 'transportation',
      filter: ['match', ['get', 'class'], ROAD_ALL, true, false],
      layout: { 'line-join': 'miter' },
      paint: { 'line-color': '#2e2e2e', 'line-width': roadWidth(3) } },
    roadLayer('routes-petites', ROAD_SMALL, 'stone'),
    roadLayer('routes-moyennes', ROAD_MID, 'cobble'),
    roadLayer('routes-grandes', ROAD_BIG, 'stonebr'),
    { id: 'rails', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 13,
      filter: ['==', ['get', 'class'], 'rail'],
      paint: { 'line-color': '#5a4a3a', 'line-width': 3, 'line-dasharray': [1, 1] } },
    { id: 'trajet-bord', type: 'line', source: 'trajet', layout: { 'line-join': 'miter' },
      paint: { 'line-color': '#3a0606', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 6, 18, 18] } },
    { id: 'trajet', type: 'line', source: 'trajet', layout: { 'line-join': 'miter' },
      paint: { 'line-color': '#e3342f', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 18, 11] } },
    buildingLayer('bat-bois', ['<=', HEIGHT, 9], 'planks'),
    buildingLayer('bat-briques', ['all', ['>', HEIGHT, 9], ['<=', HEIGHT, 21]], 'bricks'),
    buildingLayer('bat-pierre', ['>', HEIGHT, 21], 'stonebr'),
    // Faisceau lumineux au-dessus de la destination
    { id: 'balise', type: 'fill-extrusion', source: 'balise',
      paint: { 'fill-extrusion-color': '#c8f6ff', 'fill-extrusion-height': 260, 'fill-extrusion-base': 0, 'fill-extrusion-opacity': 0.55 } },
    { id: 'noms-rues', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 15,
      layout: { 'symbol-placement': 'line', 'text-field': NAME, 'text-font': ['Noto Sans Bold'], 'text-size': 14 },
      paint: { 'text-color': '#ffffff', 'text-halo-color': '#2a2a2a', 'text-halo-width': 2 } },
    { id: 'lieux', type: 'symbol', source: 'omt', 'source-layer': 'place',
      layout: { 'text-field': NAME, 'text-font': ['Noto Sans Bold'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 10, 13, 16, 19] },
      paint: { 'text-color': '#ffff55', 'text-halo-color': '#3f3f00', 'text-halo-width': 2 } }
  ]
};

/* =====================================================================
   3. CARTE
   ===================================================================== */
const PARIS = [2.3522, 48.8566];
const map = new maplibregl.Map({
  container: 'map', style, center: PARIS, zoom: 15, pitch: 58, bearing: 0, maxPitch: 70,
  pixelRatio: 1,   // basse définition volontaire : les pixels deviennent bien visibles
  attributionControl: { compact: true }
});
map.on('style.load', () => {
  for (const [id, img] of Object.entries(TEX)) if (!map.hasImage(id)) map.addImage(id, img);
  applyDayNight();
});
map.on('styleimagemissing', e => {
  if (TEX[e.id] && !map.hasImage(e.id)) map.addImage(e.id, TEX[e.id]);
});

// Animation de l'eau
let waterFrame = 0;
setInterval(() => {
  if (document.visibilityState !== 'visible' || !map.hasImage('water')) return;
  waterFrame = (waterFrame + 1) % WATER_FRAMES.length;
  map.updateImage('water', WATER_FRAMES[waterFrame]);
}, 500);

// Jour / nuit selon l'heure
function applyDayNight() {
  const h = new Date().getHours();
  const night = h >= 20 || h < 7;
  document.body.classList.toggle('night', night);
  if (map.setSky) { try { map.setSky(night ? SKY_NIGHT : SKY_DAY); } catch (e) {} }
}
setInterval(applyDayNight, 5 * 60 * 1000);

/* --- Écran de chargement --- */
const SPLASHES = ['100 % pixels !', 'Pas de bouchons ici !', 'Aussi en 3D !', 'Fait maison !', 'Roule ma poule !',
  'Attention aux creepers… de trottoir !', 'Bloc après bloc !', 'Sans abonnement !'];
$q('splash').textContent = SPLASHES[Math.floor(Math.random() * SPLASHES.length)];
let loadPct = 0;
const loadTimer = setInterval(() => {
  loadPct = Math.min(90, loadPct + 7 + Math.random() * 8);
  $q('barFill').style.width = loadPct + '%';
}, 250);
function hideLoader() {
  clearInterval(loadTimer);
  $q('barFill').style.width = '100%';
  setTimeout(() => $q('loader').classList.add('gone'), 300);
  setTimeout(() => $q('loader').classList.add('hidden'), 800);
}
map.once('idle', hideLoader);
setTimeout(hideLoader, 9000);
function $q(id) { return document.getElementById(id); }

/* =====================================================================
   4. MARQUEURS ET FLÈCHES PIXEL
   ===================================================================== */
function pixelSvg(rows, colors) {
  let rects = '';
  rows.forEach((line, y) => [...line].forEach((ch, x) => {
    // 1.05 au lieu de 1 : évite les fines lignes entre les pixels
    if (colors[ch]) rects += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${colors[ch]}"/>`;
  }));
  return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}
function pixelMarker(rows, colors, cls) {
  const el = document.createElement('div');
  el.className = 'pix ' + cls;
  el.innerHTML = pixelSvg(rows, colors);
  return el;
}
const playerEl = pixelMarker([
  '....X....',
  '...XWX...',
  '...XWX...',
  '..XWWWX..',
  '..XWWWX..',
  '.XWWWWWX.',
  '.XWWWWWX.',
  'XWWWGWWWX',
  'XWWXXXWWX',
  'XXX...XXX'
], { X: '#111', W: '#f4f4f4', G: '#cfcfcf' }, 'player');

const ARROW_UP = [

  'X........',

];
const mirror = rows => rows.map(r => [...r].reverse().join(''));
function arrowSvg(kind) {
  const c = { X: '#ffffff', Y: '#ffff55' };
  const rot = deg => `<div style="transform:rotate(${deg}deg);width:100%;height:100%">${pixelSvg(ARROW_UP, c)}</div>`;
  switch (kind) {
    case 'right': return pixelSvg(ARROW_TURN, c);
    case 'left': return pixelSvg(mirror(ARROW_TURN), c);
    case 'slight right': return rot(45);
    case 'slight left': return rot(-45);
    case 'sharp right': return rot(135);
    case 'sharp left': return rot(-135);
    case 'uturn': return pixelSvg(ARROW_UTURN, c);
    case 'round': return pixelSvg(ARROW_ROUND, c);
    case 'arrive': return pixelSvg(ARROW_FLAG, c);
    default: return pixelSvg(ARROW_UP, c);
  }
}

/* =====================================================================
   5. OUTILS
   ===================================================================== */
const $ = $q;
const toRad = d => d * Math.PI / 180;

function distance(a, b) {
  const R = 6371000;
  const dLat = toRad(b[1] - a[1]), dLon = toRad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearingBetween(a, b) {
  const y = Math.sin(toRad(b[0] - a[0])) * Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1])) * Math.sin(toRad(b[1])) -
            Math.sin(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.cos(toRad(b[0] - a[0]));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function fmtDist(m) {
  if (m < 1000) return (m < 300 ? Math.round(m / 10) * 10 : Math.round(m / 50) * 50) + ' m';
  return (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
}
function fmtDistVoice(m) {
  if (m < 1000) return Math.max(50, Math.round(m / 50) * 50) + ' mètres';
  const km = (m / 1000).toFixed(1).replace('.0', '').replace('.', ',');
  return km + (km === '1' ? ' kilomètre' : ' kilomètres');
}
function fmtDur(s) {
  const min = Math.max(1, Math.round(s / 60));
  if (min < 60) return min + ' min';
  return Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0');
}
const clock = d => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const store = {
  get(k, def) { try { const v = localStorage.getItem('blocroute.' + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('blocroute.' + k, JSON.stringify(v)); } catch (e) {} }
};
let toastTimer;
function toast(msg, ms = 3000) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
}

/* =====================================================================
   6. SONS (générés, façon bloc musical) ET VOIX

let audio = null;
function audioCtx() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
function notes(freqs, step = 0.11) {
  if (voiceMode === 'muet') return;
  const ac = audioCtx(); if (!ac) return;
  const t0 = ac.currentTime + 0.02;
  freqs.forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0 + i * step);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + i * step + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * step + step * 1.6);
    o.connect(g).connect(ac.destination);
    o.start(t0 + i * step); o.stop(t0 + i * step + step * 1.8);
  });
}
const SFX = {
  ding: () => notes([740, 988]),
  arrive: () => notes([523, 659, 784, 1047], 0.13),
  click: () => notes([1200], 0.04)
};

const VOICES = [
  { id: 'normale', label: '🔊 Normale' },

function renderVoiceBtn() { $('voiceBtn').textContent = (VOICES.find(v => v.id === voiceMode) || VOICES[0]).label; }
$('voiceBtn').addEventListener('click', () => {

  voiceMode = VOICES[(i + 1) % VOICES.length].id;
  store.set('voix', voiceMode);
  renderVoiceBtn();

  say('Voix ' + voiceMode, false);
});
renderVoiceBtn();

function frenchVoice() {
  if (!('speechSynthesis' in window)) return null;
  const all = speechSynthesis.getVoices();
  return all.find(v => v.lang === 'fr-FR') || all.find(v => v.lang && v.lang.startsWith('fr')) || null;
}
function say(text, withDing = true) {
  if (voiceMode === 'muet') return;
  if (withDing) SFX.ding();
  if (!('speechSynthesis' in window)) return;
  let t = text;
  const u = new SpeechSynthesisUtterance();

    u.pitch = 0.2; u.rate = 0.9;
  }
  u.text = t; u.lang = 'fr-FR';
  const v = frenchVoice(); if (v) u.voice = v;
  speechSynthesis.cancel();
  setTimeout(() => speechSynthesis.speak(u), withDing ? 280 : 0);
}

/* =====================================================================
   7. INSTRUCTIONS EN FRANÇAIS
   ===================================================================== */
const ORD = ['', 'première', 'deuxième', 'troisième', 'quatrième', 'cinquième', 'sixième'];
const DIR_TXT = {
  'left': 'tournez à gauche', 'right': 'tournez à droite',
  'slight left': 'serrez à gauche', 'slight right': 'serrez à droite',
  'sharp left': 'tournez fort à gauche', 'sharp right': 'tournez fort à droite',
  'straight': 'continuez tout droit', 'uturn': 'faites demi-tour'
};

function instruction(step) {
  const m = step.maneuver, type = m.type, mod = m.modifier || 'straight';
  const name = step.name ? step.name : (step.ref || '');
  const sur = name ? ' sur ' + name : '';
  const side = mod.includes('left') ? ' à gauche' : mod.includes('right') ? ' à droite' : '';
  let text, arrow = mod;

  switch (type) {
    case 'arrive':
      return { text: 'vous arrivez à destination', arrow: 'arrive' };
    case 'roundabout': case 'rotary': case 'roundabout turn':
      text = m.exit ? `au rond-point, prenez la ${ORD[m.exit] || m.exit + 'e'} sortie${sur}` : 'prenez le rond-point' + sur;
      arrow = 'round'; break;
    case 'exit roundabout': case 'exit rotary':
      text = 'sortez du rond-point' + sur; break;
    case 'merge':
      text = 'insérez-vous' + side + sur; break;
    case 'on ramp':
      text = 'prenez la bretelle' + side + sur; break;
    case 'off ramp':
      text = 'prenez la sortie' + side + sur; break;
    case 'fork':
      text = 'à la fourche, restez' + (side || ' tout droit') + sur; break;
    case 'continue': case 'new name':
      text = (mod === 'straight' ? 'continuez' : DIR_TXT[mod]) + sur; break;
    default:
      text = (DIR_TXT[mod] || 'continuez') + sur;
  }
  return { text, arrow };
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* =====================================================================
   8. ITINÉRAIRE (OSRM)
   ===================================================================== */
async function getRoute(from, to) {
  const url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}` +
              `?steps=true&geometries=geojson&overview=false`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Serveur d\'itinéraire indisponible');
  const json = await res.json();
  if (json.code !== 'Ok' || !json.routes || !json.routes.length) throw new Error('Aucun itinéraire trouvé');
  const rt = json.routes[0];
  const steps = rt.legs[0].steps;

  const coords = [], stepStart = [];
  steps.forEach(s => {
    const g = s.geometry.coordinates;
    if (!coords.length) { stepStart.push(0); coords.push(...g); }
    else { stepStart.push(coords.length - 1); coords.push(...g.slice(1)); }
  });
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + distance(coords[i - 1], coords[i]));
  return {
    coords, cum, steps,
    stepCum: stepStart.map(i => cum[i]),
    total: cum[cum.length - 1],
    duration: rt.duration
  };
}

function showRouteLine(r) {
  const src = map.getSource('trajet');
  if (!src) return;
  src.setData(r
    ? { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: r.coords } }
    : { type: 'FeatureCollection', features: [] });
}
function showBeacon(d) {
  const src = map.getSource('balise');
  if (!src) return;
  if (!d) { src.setData({ type: 'FeatureCollection', features: [] }); return; }
  const dy = 2 / 110540, dx = 2 / (111320 * Math.cos(toRad(d.lat)));
  src.setData({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [[
    [d.lon - dx, d.lat - dy], [d.lon + dx, d.lat - dy], [d.lon + dx, d.lat + dy], [d.lon - dx, d.lat + dy], [d.lon - dx, d.lat - dy]
  ]] } });
}

let lastSeg = 0;
function project(pos) {
  const c = route.coords, n = c.length;
  const kx = 111320 * Math.cos(toRad(pos[1])), ky = 110540;
  const X = p => [(p[0] - pos[0]) * kx, (p[1] - pos[1]) * ky];
  function scan(a, b) {
    let best = { dist: Infinity, i: 0, t: 0 };
    for (let i = a; i < b; i++) {
      const A = X(c[i]), B = X(c[i + 1]);
      const dx = B[0] - A[0], dy = B[1] - A[1], L2 = dx * dx + dy * dy;
      let t = L2 ? -(A[0] * dx + A[1] * dy) / L2 : 0;
      t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(A[0] + t * dx, A[1] + t * dy);
      if (d < best.dist) best = { dist: d, i, t };
    }
    return best;
  }
  let b = scan(Math.max(0, lastSeg - 10), Math.min(n - 1, lastSeg + 300));
  if (b.dist > 40) { const all = scan(0, n - 1); if (all.dist < b.dist) b = all; }
  lastSeg = b.i;
  const p1 = c[b.i], p2 = c[b.i + 1] || p1;
  const segLen = route.cum[b.i + 1] - route.cum[b.i] || 0;
  return {
    dist: b.dist,
    point: [p1[0] + (p2[0] - p1[0]) * b.t, p1[1] + (p2[1] - p1[1]) * b.t],
    along: route.cum[b.i] + b.t * segLen,
    bearing: segLen > 1 ? bearingBetween(p1, p2) : null
  };
}

function pointAt(s) {
  const cum = route.cum;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
  const seg = cum[hi] - cum[lo] || 1, t = Math.min(1, Math.max(0, (s - cum[lo]) / seg));
  const a = route.coords[lo], b = route.coords[hi];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

/* =====================================================================
   9. ÉTAT DE L'APPLI
   ===================================================================== */
let mode = 'idle';            // idle | preview | nav | arrived
let me = null;
let dest = null;
let route = null;
let announced = {};
let offCount = 0, lastReroute = 0, rerouting = false;
let sim = null, simDist = 0;
let following = true, heading = 0, lastPoint = null, firstFix = true, lastSpeed = 0;

const wazeUrl = d => `https://waze.com/ul?ll=${d.lat.toFixed(6)},${d.lon.toFixed(6)}&navigate=yes`;

function setButtons(list) {
  const row = $('bBtns'); row.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement(b.href ? 'a' : 'button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    if (b.href) { el.href = b.href; el.target = '_blank'; el.rel = 'noopener'; }
    el.addEventListener('click', () => SFX.click());
    if (b.onClick) el.addEventListener('click', b.onClick);
    row.appendChild(el);
  });
}
const navPadding = () => ({ top: Math.round(window.innerHeight * 0.4), bottom: 0, left: 0, right: 0 });

function setInfo(line1, line2) {
  $('bInfo').innerHTML = '';
  const a = document.createElement('div'); a.textContent = line1;
  const b = document.createElement('div'); b.className = 'sub'; b.textContent = line2;
  $('bInfo').append(a, b);
}

function goIdle() {
  stopSim();
  mode = 'idle'; route = null; dest = null;
  showRouteLine(null); showBeacon(null); flag.remove();
  $('top').classList.remove('hidden');
  $('instr').classList.add('hidden');
  $('bottom').classList.add('hidden');
  $('q').value = ''; renderRecents();
  following = true; $('recenter').classList.add('hidden');
  if (lastPoint) map.easeTo({ center: lastPoint, zoom: 16, pitch: 58, padding: { top: 0, bottom: 0, left: 0, right: 0 }, duration: 600 });
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

async function chooseDest(place) {
  if (!me) { toast('Attends le signal GPS avant de lancer un trajet.'); return; }
  dest = place;
  $('results').innerHTML = '';
  $('q').blur();
  addRecent(place);
  toast('Calcul de l\'itinéraire…', 10000);
  try {
    route = await getRoute(me, [place.lon, place.lat]);
  } catch (e) {
    toast(e.message || 'Impossible de calculer le trajet.');
    return;
  }
  $('toast').classList.add('hidden');
  mode = 'preview';
  showRouteLine(route);
  showBeacon(place);
  flag.setLngLat([place.lon, place.lat]).addTo(map);

  $('top').classList.add('hidden');
  $('bottom').classList.remove('hidden');
  setInfo(place.label, `${fmtDur(route.duration)} · ${fmtDist(route.total)} · arrivée ${clock(new Date(Date.now() + route.duration * 1000))}`);
  setButtons([
    { label: 'Démarrer', cls: 'green', onClick: () => startNav(false) },
    { label: 'Simuler', onClick: () => startNav(true) },
    { label: 'Waze', cls: 'blue', href: wazeUrl(place) },
    { label: '✕', cls: 'red', onClick: goIdle }
  ]);

  following = false;
  const b = new maplibregl.LngLatBounds();
  route.coords.forEach(c => b.extend(c));
  map.jumpTo({ pitch: 0, bearing: 0 });
  map.fitBounds(b, { padding: { top: 60, bottom: 200, left: 40, right: 70 }, duration: 800 });
}

function startNav(simulate) {
  mode = 'nav'; announced = {}; lastSeg = 0; offCount = 0;
  following = true; $('recenter').classList.add('hidden');
  $('instr').classList.remove('hidden');
  setButtons([
    { label: 'Ouvrir dans Waze', cls: 'blue', href: wazeUrl(dest) },
    { label: 'Arrêter', cls: 'red', onClick: goIdle }
  ]);
  keepAwake();
  audioCtx();

  const first = route.steps[1] ? instruction(route.steps[1]) : null;
  say('C\'est parti.' + (first ? ' Ensuite, ' + first.text + '.' : ''));

  map.easeTo({ zoom: 17.5, pitch: 62, padding: navPadding(), duration: 800 });

  if (simulate) startSim();
  else if (me) handleFix({ pos: me, speed: lastSpeed, heading: null, accuracy: 10 });
}

let shownArrow = '';
function updateGuidance(along) {
  const remaining = Math.max(0, route.total - along);
  if (remaining < 25) { arrive(); return; }

  let k = route.stepCum.findIndex((v, i) => i >= 1 && v > along + 3);
  if (k < 0) k = route.steps.length - 1;
  const toNext = route.stepCum[k] - along;
  const ins = instruction(route.steps[k]);

  if (shownArrow !== ins.arrow) { $('iArrow').innerHTML = arrowSvg(ins.arrow); shownArrow = ins.arrow; }
  $('iDist').textContent = fmtDist(toNext);
  $('iTxt').textContent = cap(ins.text);

  const remSec = route.duration * (remaining / route.total);
  setInfo(`Arrivée ${clock(new Date(Date.now() + remSec * 1000))}`, `${fmtDur(remSec)} · ${fmtDist(remaining)}`);

  const far = lastSpeed > 15 ? 700 : 350;
  const a = announced[k] || (announced[k] = {});
  if (toNext <= 30) {
    if (!a.now) { a.now = a.near = a.far = true; say(cap(ins.text) + '.'); }
  } else if (toNext <= 150) {
    if (!a.near) { a.near = a.far = true; say(`Dans ${fmtDistVoice(toNext)}, ${ins.text}.`); }
  } else if (toNext <= far) {
    if (!a.far) { a.far = true; say(`Dans ${fmtDistVoice(toNext)}, ${ins.text}.`); }
  }
}

function arrive() {
  if (mode !== 'nav') return;
  mode = 'arrived';
  stopSim();
  SFX.arrive();
  setTimeout(() => say('Vous êtes arrivé. Bien joué !', false), 600);
  $('iArrow').innerHTML = arrowSvg('arrive'); shownArrow = 'arrive';
  $('iDist').textContent = 'Arrivé !';
  $('iTxt').textContent = dest ? dest.label : '';
  setButtons([{ label: 'Terminer', cls: 'green', onClick: goIdle }]);
}

async function reroute(pos) {
  if (rerouting || Date.now() - lastReroute < 10000) return;
  rerouting = true; lastReroute = Date.now(); offCount = 0;
  say('Recalcul de l\'itinéraire.');
  toast('Recalcul…');
  try {
    route = await getRoute(pos, [dest.lon, dest.lat]);
    lastSeg = 0; announced = {};
    showRouteLine(route);
  } catch (e) {
    toast('Recalcul impossible pour l\'instant.');
  }
  rerouting = false;
}

function startSim() {
  stopSim();
  simDist = 0;
  const speed = 14;
  sim = setInterval(() => {
    if (!route) return;
    simDist = Math.min(route.total, simDist + speed);
    handleFix({ pos: pointAt(simDist), speed, heading: null, accuracy: 5 });
  }, 1000);
  toast('Simulation à 50 km/h');
}
function stopSim() { if (sim) { clearInterval(sim); sim = null; } }

/* =====================================================================
   10. GPS ET CAMÉRA
   ===================================================================== */
function handleFix(f) {
  const cur = f.pos;
  lastSpeed = f.speed || 0;

  if (f.heading != null && !isNaN(f.heading) && lastSpeed > 1) heading = f.heading;
  else if (lastPoint && distance(lastPoint, cur) > 6) heading = bearingBetween(lastPoint, cur);
  if (!lastPoint || distance(lastPoint, cur) > 6) lastPoint = cur;

  let shown = cur, camBearing = heading;

  if (mode === 'nav' && route) {
    const pr = project(cur);
    if (pr.dist < 30) {
      shown = pr.point;
      if (pr.bearing != null) camBearing = pr.bearing;
      offCount = 0;
    } else if (pr.dist > 45 && (f.accuracy || 99) < 50) {
      offCount++;
      if (offCount >= 3) reroute(cur);
    }
    updateGuidance(pr.along);
  }

  player.setLngLat(shown).setRotation(camBearing);
  if (!playerShown) { player.addTo(map); playerShown = true; }

  if (firstFix) {
    map.jumpTo({ center: shown, zoom: 16, pitch: 58, bearing: 0 });
    firstFix = false;
  } else if (following && (mode === 'nav' || mode === 'arrived')) {
    map.easeTo({ center: shown, bearing: camBearing, padding: navPadding(), duration: 1000, easing: t => t });
  } else if (following && mode === 'idle') {
    map.easeTo({ center: shown, duration: 1000, easing: t => t });
  }
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(p => {
    me = [p.coords.longitude, p.coords.latitude];
    if (sim) return;
    handleFix({ pos: me, speed: p.coords.speed, heading: p.coords.heading, accuracy: p.coords.accuracy });
  }, err => {
    toast(err.code === 1 ? 'GPS refusé : autorise la localisation pour ce site.' : 'Signal GPS introuvable…');
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
} else {
  toast('Ce navigateur ne gère pas le GPS.');
}

map.on('dragstart', () => { following = false; $('recenter').classList.remove('hidden'); });
$('recenter').addEventListener('click', () => {
  SFX.click();
  following = true; $('recenter').classList.add('hidden');
  const target = player.getLngLat();
  if (mode === 'nav' || mode === 'arrived') map.easeTo({ center: target, zoom: 17.5, pitch: 62, padding: navPadding(), duration: 600 });
  else map.easeTo({ center: target, zoom: 16, pitch: 58, duration: 600 });
});

/* =====================================================================
   11. RECHERCHE (Photon) + RÉCENTS
   ===================================================================== */
function addRecent(p) {
  const list = store.get('recents', []).filter(r => !(r.lat === p.lat && r.lon === p.lon));
  list.unshift(p);
  store.set('recents', list.slice(0, 5));
}
function renderList(items, title) {
  const ul = $('results'); ul.innerHTML = '';
  if (!items.length) return;
  if (title) { const h = document.createElement('li'); h.className = 'head'; h.textContent = title; ul.appendChild(h); }
  items.forEach(p => {
    const li = document.createElement('li');
    const a = document.createElement('div'); a.textContent = p.label;
    const b = document.createElement('div'); b.className = 'sub'; b.textContent = p.sub || '';
    li.append(a, b);
    if (!p.none) li.addEventListener('click', () => { SFX.click(); chooseDest(p); });
    ul.appendChild(li);
  });
}
function renderRecents() { renderList(store.get('recents', []), 'Récents'); }

function photonToPlace(f) {
  const p = f.properties, [lon, lat] = f.geometry.coordinates;
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const label = p.name || street || p.city || 'Lieu';
  const sub = [p.name && street ? street : '', [p.postcode, p.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  return { lon, lat, label, sub };
}

let searchTimer, searchId = 0;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = $('q').value.trim();
  if (q.length < 3) { renderRecents(); return; }
  searchTimer = setTimeout(async () => {
    const id = ++searchId;
    let url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=fr&limit=6`;
    if (me) url += `&lat=${me[1].toFixed(4)}&lon=${me[0].toFixed(4)}`;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (id !== searchId) return;
      const items = (json.features || []).map(photonToPlace);
      if (!items.length) renderList([{ label: 'Aucun résultat', sub: 'Essaie avec la ville en plus', none: true }]);
      else renderList(items);
    } catch (e) {
      toast('Recherche impossible (pas de réseau ?)');
    }
  }, 400);
});
$('q').addEventListener('focus', () => { if ($('q').value.trim().length < 3) renderRecents(); });
renderRecents();

/* =====================================================================
   12. ÉCRAN ALLUMÉ + INSTALLATION
   ===================================================================== */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* pas grave */ }
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('click', keepAwake, { once: true });
keepAwake();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
